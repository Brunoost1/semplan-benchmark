name: semplan-benchmark

services:
  semplan-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: semplan
      POSTGRES_USER: semplan_admin
      POSTGRES_PASSWORD: semplan_local_password
    ports:
      - "${SEMPLAN_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semplan_admin -d semplan"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - semplan_pgdata:/var/lib/postgresql/data
      - ./db/seed:/docker-entrypoint-initdb.d:ro

volumes:
  semplan_pgdata:
